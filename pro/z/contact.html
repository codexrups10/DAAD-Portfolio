                    <img src="./images/logo.png" alt="ZUDIO Logo" width="180px">

                <nav>
                    <ul>

    </div>
<header>
    <h1>ZUDIO - Contact Us</h1>
    <p>We’re here to help you with your shopping needs.</p>
  </header>

  <section class="contact-info">
    <h2>Contact Information</h2>
    <p><strong>Email:</strong> support@zudio.com</p>
    <p><strong>Phone:</strong> +91 98765 43210</p>
    <p><strong>Address:</strong> ZUDIO HQ, Kolkata, India</p>
  </section>

  <section class="contact-form">
    <h2>Send Us a Message</h2>
    <form>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your Name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="your@email.com" required>

      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" placeholder="Message Subject" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="Write your message..." required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2025 ZUDIO. All rights reserved.</p>
  </footer>
</body>
